<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Rana Khan — Security Researcher and Bug Bounty Hunter from Bangladesh, founder of 2mny.com">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#1a2333" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="sweepGrad" gradientUnits="userSpaceOnUse" x1="185" y1="58" x2="282" y2="114">
      <stop offset="0" stop-color="#00d9a6" stop-opacity="0"/>
      <stop offset="1" stop-color="#00d9a6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="345" y1="150" x2="965" y2="150">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#00d9a6"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9a6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9a6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00d9a6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="338" rx="15.5"/></clipPath>
    <clipPath id="typeClip">
      <rect x="424" y="210" height="44" width="0">
        <animate attributeName="width" dur="12.5s" repeatCount="indefinite" calcMode="discrete"
                 values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;396;408;420;432;444;456;468;480;492;504;516;528;540;552;564;576;588;600;612;624;636;665;665" keyTimes="0;0.015;0.03;0.045;0.06;0.075;0.09;0.105;0.12;0.135;0.15;0.165;0.18;0.195;0.21;0.225;0.24;0.255;0.27;0.285;0.3;0.315;0.33;0.345;0.36;0.375;0.39;0.405;0.42;0.435;0.45;0.465;0.48;0.495;0.51;0.525;0.54;0.555;0.57;0.585;0.6;0.615;0.63;0.645;0.66;0.675;0.69;0.705;0.72;0.735;0.75;0.765;0.78;0.795;0.8;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background + grid -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="#0d1117" stroke="#293548" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="338" rx="15.5" fill="url(#grid)"/>

  <!-- sweeping scan beam -->
  <g clip-path="url(#frame)">
    <rect x="0" y="1" width="90" height="338" fill="url(#beamGrad)">
      <animateTransform attributeName="transform" type="translate" from="-120 0" to="1230 0" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- viewfinder corner brackets -->
  <g fill="none" stroke="#30363d" stroke-width="2.5" opacity="0.9">
    <path d="M 30 62 V 44 Q 30 30 44 30 H 62"/>
    <path d="M 1138 30 H 1156 Q 1170 30 1170 44 V 62"/>
    <path d="M 30 278 V 296 Q 30 310 44 310 H 62"/>
    <path d="M 1170 278 V 296 Q 1170 310 1156 310 H 1138"/>
  </g>

  <!-- radar -->
  <g>
    <circle cx="185" cy="170" r="126" fill="#0f1520" stroke="#1f2a3a" stroke-width="1.5"/>
    <circle cx="185" cy="170" r="112" fill="none" stroke="#2c3b4f" stroke-width="1.5"/>
    <circle cx="185" cy="170" r="76" fill="none" stroke="#233042" stroke-width="1"/>
    <circle cx="185" cy="170" r="40" fill="none" stroke="#233042" stroke-width="1"/>
    <line x1="185" y1="58" x2="185" y2="282" stroke="#233042" stroke-width="1"/>
    <line x1="73" y1="170" x2="297" y2="170" stroke="#233042" stroke-width="1"/>
    <!-- rotating sweep -->
    <g>
      <path d="M 185 170 L 185 58 A 112 112 0 0 1 281.99 114 Z" fill="url(#sweepGrad)"/>
      <line x1="185" y1="170" x2="281.99" y2="114" stroke="#00d9a6" stroke-width="2" opacity="0.85"/>
      <animateTransform attributeName="transform" type="rotate" from="0 185 170" to="360 185 170" dur="4s" repeatCount="indefinite"/>
    </g>
    <!-- pulsing blips -->
    <circle cx="150" cy="120" r="4" fill="#00d9a6">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="120" r="4" fill="none" stroke="#00d9a6" stroke-width="1">
      <animate attributeName="r" values="4;15" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="232" cy="196" r="3.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="232" cy="196" r="3.5" fill="none" stroke="#58a6ff" stroke-width="1">
      <animate attributeName="r" values="3.5;13" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="206" cy="104" r="3" fill="#00d9a6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="136" cy="214" r="3.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <!-- center -->
    <circle cx="185" cy="170" r="4" fill="#e6edf3" opacity="0.9"/>
    <circle cx="185" cy="170" r="4" fill="none" stroke="#e6edf3" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="4;11" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name + role -->
  <text x="345" y="118" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="3" fill="#e6edf3">RANA KHAN</text>
  <rect x="345" y="130" width="160" height="3.5" rx="1.75" fill="url(#accent)"/>
  <text x="345" y="162" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3" fill="url(#accent)">SECURITY RESEARCHER · BUG BOUNTY HUNTER</text>

  <!-- location + founder line (Bangladesh flag drawn as shapes) -->
  <rect x="345" y="170" width="21" height="14" rx="2" fill="#006a4e"/>
  <circle cx="353" cy="177" r="4.6" fill="#f42a41"/>
  <text x="374" y="181" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18.5" fill="#8b949e">Bangladesh — founder of 2mny.com · bug bounty platform &amp; 317-module scanner</text>

  <!-- terminal with typing effect (cursor is an in-flow glyph: zero drift on any OS font) -->
  <rect x="345" y="208" width="815" height="48" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="365" cy="232" r="4.5" fill="#ff5f56"/>
  <circle cx="383" cy="232" r="4.5" fill="#ffbd2e"/>
  <circle cx="401" cy="232" r="4.5" fill="#27c93f"/>
  <text x="424" y="239" font-family="'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#e6edf3" clip-path="url(#typeClip)"><tspan fill="#00d9a6">$</tspan> scan --target 2mny.com --modules 317 --evidence full<tspan fill="#00d9a6">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- live status chip -->
  <rect x="950" y="32" width="185" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="969" cy="49" r="5" fill="#00d9a6">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="982" y="54" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#00d9a6">317 MODULES LIVE</text>

  <!-- faint keyword texture -->
  <text x="1148" y="296" text-anchor="end" font-family="'Cascadia Code',Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#46586e">xss · sqli · ssrf · ssti · idor · osint · recon</text>

  <!-- data flow line -->
  <line x1="40" y1="322" x2="1160" y2="322" stroke="#21293a" stroke-width="1.5"/>
  <g clip-path="url(#frame)">
    <rect x="0" y="318.5" width="140" height="7" rx="3.5" fill="url(#flowGrad)">
      <animateTransform attributeName="transform" type="translate" from="-150 0" to="1170 0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
